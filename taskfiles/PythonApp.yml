# taskfiles/PythonApp.yml
# Reusable task definitions for cosalette apps.
# Included by root Taskfile.yml with per-app variables.
version: '3'

vars:
  APP_NAME: '{{.APP_NAME}}'
  MODULE_NAME: '{{.MODULE_NAME | default .APP_NAME}}'
  PKG: packages

tasks:
  test:
    desc: 'Run all tests for {{.APP_NAME}} with coverage'
    cmds:
      - |
        if ! find {{.PKG}}/tests/unit/ \( -name 'test_*.py' -o -name '*_test.py' \) 2>/dev/null | grep -qm1 .; then
          echo "ℹ No unit tests found — skipping"
          exit 0
        fi
        uv run --package {{.APP_NAME}} pytest {{.PKG}}/tests/unit/ -v --tb=short \
          --junitxml=results-unit.xml \
          --cov={{.PKG}}/src/{{.MODULE_NAME}} --cov-branch --cov-report=json

  test:unit:
    desc: 'Run unit tests for {{.APP_NAME}}'
    cmds:
      - |
        if ! find {{.PKG}}/tests/unit/ \( -name 'test_*.py' -o -name '*_test.py' \) 2>/dev/null | grep -qm1 .; then
          echo "ℹ No unit tests found — skipping"
          exit 0
        fi
        uv run --package {{.APP_NAME}} pytest {{.PKG}}/tests/unit/ -v --tb=short \
          --junitxml=results-unit.xml

  test:file:
    desc: 'Run specific test file (e.g.: task {{.APP_NAME}}:test:file -- test_foo.py)'
    cmds:
      - |
        if [ -z "{{.CLI_ARGS}}" ]; then
          echo "Usage: task {{.APP_NAME}}:test:file -- <path-or-pattern>" >&2
          exit 1
        fi
        uv run --package {{.APP_NAME}} pytest {{.CLI_ARGS}} -v --tb=short

  test:integration:
    desc: 'Run integration tests for {{.APP_NAME}}'
    cmds:
      - |
        if ! find {{.PKG}}/tests/integration/ \( -name 'test_*.py' -o -name '*_test.py' \) 2>/dev/null | grep -qm1 .; then
          echo "ℹ No integration tests found — skipping"
          exit 0
        fi
        uv run --package {{.APP_NAME}} pytest {{.PKG}}/tests/integration/ -v --tb=short \
          -m integration

  test:cov:
    desc: 'Run tests with coverage for {{.APP_NAME}}'
    cmds:
      - uv run --package {{.APP_NAME}} pytest {{.PKG}}/tests/ \
        --cov={{.PKG}}/src/{{.MODULE_NAME}} --cov-branch \
        --cov-report=term-missing --cov-report=xml

  test:cov:html:
    desc: 'Run tests with HTML coverage for {{.APP_NAME}}'
    cmds:
      - uv run --package {{.APP_NAME}} pytest {{.PKG}}/tests/ \
        --cov={{.PKG}}/src/{{.MODULE_NAME}} --cov-branch \
        --cov-report=html --cov-report=term
      - cmd: '{{if eq OS "darwin"}}open{{else}}xdg-open{{end}} htmlcov/index.html'
        ignore_error: true

  lint:
    desc: 'Lint {{.APP_NAME}}'
    cmds:
      - uv run ruff check {{.PKG}}/src/ {{.PKG}}/tests/
      - uv run ruff format --check {{.PKG}}/src/ {{.PKG}}/tests/

  lint:fix:
    desc: 'Fix lint issues for {{.APP_NAME}}'
    cmds:
      - uv run ruff check --fix {{.PKG}}/src/ {{.PKG}}/tests/
      - uv run ruff format {{.PKG}}/src/ {{.PKG}}/tests/

  typecheck:
    desc: 'Type check {{.APP_NAME}}'
    cmds:
      - uv run ty check {{.PKG}}/src/

  check:
    desc: 'Run all checks for {{.APP_NAME}}'
    cmds:
      - task: lint
      - task: typecheck
      - task: schema:check
      - task: test

  schema:check:
    desc: 'Validate {{.APP_NAME}} registrations against docs/schema.yaml'
    # Apps with settings-derived (ADR-023 callable name=) registrations set
    # SCHEMA_ENV_FILE and/or SCHEMA_CONFIG_FILE (see the caldates2mqtt /
    # velux2mqtt includes in the root Taskfile.yml): cosalette 0.6.0 extends
    # --resolve-settings/--env-file to `schema check` (previously dump-only,
    # cap-wv9 part b) and 0.6.1 adds --config-file beside it for apps whose
    # inventory lives in a TOML/YAML/JSON file (cap-10u.5). Either variable
    # switches this task to the resolving branch, so those apps are validated
    # against the same checked-in profile schema:generate uses.
    #
    # EXPECTED WARNINGS — these are not drift, and the task still exits 0:
    #   wiz2mqtt "example — EXTRA": docs/schema.yaml carries no channels at all
    #     (the bulb inventory is TOML-driven), so the resolved placeholder bulb
    #     has nothing to match. Tracked under cap-85q.
    #
    # jeelink2mqtt's "receiver — EXTRA" false positive (root-level @app.stream
    # entities misreported as EXTRA) was fixed upstream in cosalette 0.9.1 —
    # `schema check` now excludes root-entity names from the device-status
    # comparison (cosalette#435). No longer expected; see cap-85q.
    vars:
      RESOLVE_FLAGS: '{{if .SCHEMA_ENV_FILE}}--env-file {{.SCHEMA_ENV_FILE}} {{end}}{{if .SCHEMA_CONFIG_FILE}}--config-file {{.SCHEMA_CONFIG_FILE}}{{end}}'
    cmds:
      - |
        {{if .RESOLVE_FLAGS}}
        uv run --package {{.APP_NAME}} cosalette schema check \
          --app {{.APP_SPEC | default (printf "%s.main:app" .MODULE_NAME)}} \
          --schema docs/schema.yaml --resolve-settings {{.RESOLVE_FLAGS}}
        {{else}}
        uv run --package {{.APP_NAME}} cosalette schema check --app {{.APP_SPEC | default (printf "%s.main:app" .MODULE_NAME)}} --schema docs/schema.yaml
        {{end}}

  schema:generate:
    desc: 'Regenerate docs/schema.yaml for {{.APP_NAME}} from the app registrations'
    # Model-driven apps (state_model fields carrying x-cosalette-consumer via
    # pydantic.Field(json_schema_extra=...), e.g. vito2mqtt/gas2mqtt/velux2mqtt)
    # regenerate hands-off: TypeAdapter(model).json_schema() preserves the
    # consumer enrichment, so NO manual re-enrichment is needed. Apps that still
    # hand-author x-cosalette-consumer directly in docs/schema.yaml must re-apply
    # it after running this task. (x-cosalette-app never needs re-adding:
    # cosalette 0.5.7+ auto-emits it per channel from the App registry.)
    #
    # Apps with settings-derived (ADR-023 callable name=) registrations set
    # SCHEMA_ENV_FILE and/or SCHEMA_CONFIG_FILE (see the caldates2mqtt /
    # velux2mqtt includes in the root Taskfile.yml). cosalette 0.6.0 extended
    # --resolve-settings/--env-file to `schema init` too (cap-wv9 part b,
    # previously dump-only) and 0.6.1 added --config-file (cap-10u.5), but this
    # task keeps using `schema dump --resolve-settings <profile flags>` and
    # manually re-layers the static x-cosalette-enforcement scaffold, matching
    # the non-settings-derived branch below byte-for-byte. See cap-0cg /
    # ADR-051.
    prompt: 'This will overwrite docs/schema.yaml for {{.APP_NAME}}. Hand-authored (non-model-driven) consumer enrichment would need re-applying. Continue?'
    vars:
      RESOLVE_FLAGS: '{{if .SCHEMA_ENV_FILE}}--env-file {{.SCHEMA_ENV_FILE}} {{end}}{{if .SCHEMA_CONFIG_FILE}}--config-file {{.SCHEMA_CONFIG_FILE}}{{end}}'
    cmds:
      - |
        {{if .RESOLVE_FLAGS}}
        uv run --package {{.APP_NAME}} cosalette schema dump \
          --app {{.APP_SPEC | default (printf "%s.main:app" .MODULE_NAME)}} \
          --resolve-settings {{.RESOLVE_FLAGS}} > docs/schema.yaml.tmp
        cat >> docs/schema.yaml.tmp <<'ENFORCEMENT'
        x-cosalette-enforcement:
          mode: warn
          on_configure: true
          on_publish: false
          network_level: false
        ENFORCEMENT
        {{else}}
        uv run --package {{.APP_NAME}} cosalette schema init \
          --app {{.APP_SPEC | default (printf "%s.main:app" .MODULE_NAME)}} > docs/schema.yaml.tmp
        {{end}}
        mv docs/schema.yaml.tmp docs/schema.yaml

  schema:ha-discovery:
    desc: 'Generate Home Assistant MQTT discovery payloads for {{.APP_NAME}}'
    cmds:
      - uv run --package {{.APP_NAME}} cosalette schema ha-discovery docs/schema.yaml

  complexity:
    desc: 'Check code complexity for {{.APP_NAME}}'
    cmds:
      - uv run radon cc {{.PKG}}/src/{{.MODULE_NAME}} --average --show-complexity
      - uv run xenon {{.PKG}}/src/{{.MODULE_NAME}} --max-absolute B --max-modules A --max-average A
      - uv run flake8 --select CCR001 --max-cognitive-complexity 15 {{.PKG}}/src/{{.MODULE_NAME}}

  similarity:
    desc: 'Check code duplication for {{.APP_NAME}}'
    cmds:
      # --ignore-comments strips the shared 15-line GPL license header carried by
      # every source file; without it symilar reports each header pair as a false
      # duplicate (e.g. vito2mqtt: 159 phantom dupes), making the gate useless.
      - |
        OUTPUT=$(uv run symilar -d 4 --ignore-comments --ignore-imports --ignore-signatures \
          $(find {{.PKG}}/src/{{.MODULE_NAME}} -name '*.py'))
        echo "$OUTPUT"
        DUPES=$(printf '%s\n' "$OUTPUT" | sed -n 's/.*duplicates=\([0-9][0-9]*\).*/\1/p' | head -n1)
        if [ "${DUPES:-0}" -gt 0 ]; then
          echo "❌ Found $DUPES duplicate lines"
          exit 1
        fi

  docs:pre-build:
    desc: 'Run pre-build script for {{.APP_NAME}} docs (if it exists)'
    internal: true
    cmds:
      - |
        if [ -f docs/_scripts/pre_build.py ]; then
          uv run --package {{.APP_NAME}} python docs/_scripts/pre_build.py
        fi

  docs:copy-shared:
    desc: 'Copy shared doc assets into {{.APP_NAME}} docs dir'
    internal: true
    cmds:
      - mkdir -p docs/stylesheets docs/javascripts
      - cp {{.ROOT_DIR}}/docs/shared/stylesheets/extra.css docs/stylesheets/extra.css
      - cp {{.ROOT_DIR}}/docs/shared/stylesheets/click-zoom.css docs/stylesheets/click-zoom.css
      - cp {{.ROOT_DIR}}/docs/shared/javascripts/click-zoom.js docs/javascripts/click-zoom.js
      - cp {{.ROOT_DIR}}/docs/shared/javascripts/version-fetch.js docs/javascripts/version-fetch.js
      - cp {{.ROOT_DIR}}/docs/shared/javascripts/header-breadcrumb.js docs/javascripts/header-breadcrumb.js
      - cp {{.ROOT_DIR}}/docs/shared/javascripts/palette-sync.js docs/javascripts/palette-sync.js

  docs:serve:
    desc: 'Preview docs for {{.APP_NAME}}'
    cmds:
      - task: docs:pre-build
      - task: docs:copy-shared
      - uv run --project {{.ROOT_DIR}} --group docs zensical serve --dev-addr 0.0.0.0:8001

  docs:build:
    desc: 'Build docs for {{.APP_NAME}}'
    cmds:
      - task: docs:pre-build
      - task: docs:copy-shared
      - uv run --project {{.ROOT_DIR}} --group docs zensical build --clean

  # ── CI Helpers ──────────────────────────────────────────────
  ci:test:unit:
    desc: 'CI unit tests with coverage for {{.APP_NAME}}'
    cmds:
      - |
        if ! find {{.PKG}}/tests/unit/ \( -name 'test_*.py' -o -name '*_test.py' \) 2>/dev/null | grep -qm1 .; then
          echo "ℹ No unit tests found in {{.PKG}}/tests/unit/ — skipping"
          exit 0
        fi
        uv run --package {{.APP_NAME}} pytest {{.PKG}}/tests/unit/ \
          --cov={{.PKG}}/src/{{.MODULE_NAME}} --cov-branch \
          --cov-report=xml --cov-report=json --cov-report=term \
          --junitxml=results-unit.xml --cov-fail-under=80

  ci:test:integration:
    desc: 'CI integration tests for {{.APP_NAME}}'
    cmds:
      - |
        if find {{.PKG}}/tests/integration/ \( -name 'test_*.py' -o -name '*_test.py' \) 2>/dev/null | grep -qm1 .; then
          uv run --package {{.APP_NAME}} pytest {{.PKG}}/tests/integration/ \
            -v --tb=short -m integration \
            --junitxml=results-integration.xml
        else
          echo "ℹ No integration tests found in {{.PKG}}/tests/integration/ — skipping"
        fi

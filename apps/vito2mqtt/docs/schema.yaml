asyncapi: 3.0.0
info:
  title: vito2mqtt
  version: 0.1.3
  x-cosalette-contract-version: '1'
channels:
  burnerState:
    address: vito2mqtt/burner/state
    messages:
      message:
        payload:
          properties:
            boiler_temperature:
              title: Boiler Temperature
              type: number
              x-cosalette-consumer:
                display_name: Boiler Temperature
                device_class: temperature
                unit: °C
                state_class: measurement
            boiler_temperature_lowpass:
              title: Boiler Temperature Lowpass
              type: number
              x-cosalette-consumer:
                display_name: Boiler Temperature (Low-pass)
                device_class: temperature
                unit: °C
                state_class: measurement
            boiler_temperature_setpoint:
              title: Boiler Temperature Setpoint
              type: number
              x-cosalette-consumer:
                display_name: Boiler Temperature Setpoint
                device_class: temperature
                unit: °C
                state_class: measurement
            exhaust_temperature:
              title: Exhaust Temperature
              type: number
              x-cosalette-consumer:
                display_name: Exhaust Temperature
                device_class: temperature
                unit: °C
                state_class: measurement
            burner_modulation:
              title: Burner Modulation
              type: integer
              x-cosalette-consumer:
                display_name: Burner Modulation
                unit: "%"
                state_class: measurement
                icon: "mdi:fire"
            burner_starts:
              title: Burner Starts
              type: integer
              x-cosalette-consumer:
                display_name: Burner Starts
                state_class: total_increasing
                icon: "mdi:fire"
            burner_hours_stage1:
              title: Burner Hours Stage1
              type: number
              x-cosalette-consumer:
                display_name: Burner Hours (Stage 1)
                device_class: duration
                unit: h
                state_class: total_increasing
                icon: "mdi:timer-outline"
            plant_power_output:
              title: Plant Power Output
              type: number
              x-cosalette-consumer:
                display_name: Plant Power Output
                unit: "%"
                state_class: measurement
                icon: "mdi:gauge"
          required:
          - boiler_temperature
          - boiler_temperature_lowpass
          - boiler_temperature_setpoint
          - exhaust_temperature
          - burner_modulation
          - burner_starts
          - burner_hours_stage1
          - plant_power_output
          title: BurnerState
          type: object
    x-cosalette-archetype: telemetry
    x-cosalette-app: vito2mqtt
    x-cosalette-summary: Read burner temperature, modulation and runtime data via
      Optolink serial
  diagnosisState:
    address: vito2mqtt/diagnosis/state
    messages:
      message:
        payload:
          properties:
            error_status:
              title: Error Status
              type: string
            error_history_1:
              $ref: '#/components/schemas/ErrorHistoryEntry'
            error_history_2:
              $ref: '#/components/schemas/ErrorHistoryEntry'
            error_history_3:
              $ref: '#/components/schemas/ErrorHistoryEntry'
            error_history_4:
              $ref: '#/components/schemas/ErrorHistoryEntry'
            error_history_5:
              $ref: '#/components/schemas/ErrorHistoryEntry'
            error_history_6:
              $ref: '#/components/schemas/ErrorHistoryEntry'
            error_history_7:
              $ref: '#/components/schemas/ErrorHistoryEntry'
            error_history_8:
              $ref: '#/components/schemas/ErrorHistoryEntry'
            error_history_9:
              $ref: '#/components/schemas/ErrorHistoryEntry'
            error_history_10:
              $ref: '#/components/schemas/ErrorHistoryEntry'
          required:
          - error_status
          - error_history_1
          - error_history_2
          - error_history_3
          - error_history_4
          - error_history_5
          - error_history_6
          - error_history_7
          - error_history_8
          - error_history_9
          - error_history_10
          title: DiagnosisState
          type: object
    x-cosalette-archetype: telemetry
    x-cosalette-summary: Read diagnostic error codes and system health data via Optolink
      serial
  heating_floorCommand:
    address: vito2mqtt/heating_floor/set
    messages:
      message:
        payload:
          additionalProperties: true
          type: object
    x-cosalette-archetype: command
    x-cosalette-summary: Set floor heating circuit temperatures and schedules
  heating_floorState:
    address: vito2mqtt/heating_floor/state
    messages:
      message:
        payload:
          oneOf:
          - properties:
              flow_temperature_m2:
                title: Flow Temperature M2
                type: number
                x-cosalette-consumer:
                  display_name: Flow Temperature M2 (Floor)
                  device_class: temperature
                  unit: °C
                  state_class: measurement
              flow_temperature_setpoint_m2:
                title: Flow Temperature Setpoint M2
                type: number
                x-cosalette-consumer:
                  display_name: Flow Temperature Setpoint M2 (Floor)
                  device_class: temperature
                  unit: °C
                  state_class: measurement
              pump_status_m2:
                title: Pump Status M2
                type: string
              pump_speed_m2:
                title: Pump Speed M2
                type: integer
                x-cosalette-consumer:
                  display_name: Pump Speed M2 (Floor)
                  unit: "%"
                  state_class: measurement
                  icon: "mdi:pump"
              frost_warning_m2:
                title: Frost Warning M2
                type: integer
              frost_limit_m2:
                title: Frost Limit M2
                type: integer
              operating_mode_m2:
                title: Operating Mode M2
                type: string
              operating_mode_economy_m2:
                title: Operating Mode Economy M2
                type: string
            required:
            - flow_temperature_m2
            - flow_temperature_setpoint_m2
            - pump_status_m2
            - pump_speed_m2
            - frost_warning_m2
            - frost_limit_m2
            - operating_mode_m2
            - operating_mode_economy_m2
            title: HeatingFloorState
            type: object
          - anyOf: &id001
            - additionalProperties: true
              type: object
            - type: 'null'
    x-cosalette-archetype: telemetry
    x-cosalette-app: vito2mqtt
    x-cosalette-summary: Read floor heating circuit temperatures and pump status via
      Optolink serial
  heating_radiatorCommand:
    address: vito2mqtt/heating_radiator/set
    messages:
      message:
        payload:
          additionalProperties: true
          type: object
    x-cosalette-archetype: command
    x-cosalette-summary: Set radiator heating circuit temperatures and schedules
  heating_radiatorState:
    address: vito2mqtt/heating_radiator/state
    messages:
      message:
        payload:
          oneOf:
          - properties:
              flow_temperature_m1:
                title: Flow Temperature M1
                type: number
                x-cosalette-consumer:
                  display_name: Flow Temperature M1 (Radiator)
                  device_class: temperature
                  unit: °C
                  state_class: measurement
              flow_temperature_setpoint_m1:
                title: Flow Temperature Setpoint M1
                type: number
                x-cosalette-consumer:
                  display_name: Flow Temperature Setpoint M1 (Radiator)
                  device_class: temperature
                  unit: °C
                  state_class: measurement
              pump_status_m1:
                title: Pump Status M1
                type: integer
              frost_warning_m1:
                title: Frost Warning M1
                type: integer
              frost_limit_m1:
                title: Frost Limit M1
                type: integer
              operating_mode_m1:
                title: Operating Mode M1
                type: string
              operating_mode_economy_m1:
                title: Operating Mode Economy M1
                type: string
            required:
            - flow_temperature_m1
            - flow_temperature_setpoint_m1
            - pump_status_m1
            - frost_warning_m1
            - frost_limit_m1
            - operating_mode_m1
            - operating_mode_economy_m1
            title: HeatingRadiatorState
            type: object
          - anyOf: *id001
    x-cosalette-archetype: telemetry
    x-cosalette-app: vito2mqtt
    x-cosalette-summary: Read radiator heating circuit temperatures and pump status
      via Optolink serial
  hot_waterCommand:
    address: vito2mqtt/hot_water/set
    messages:
      message:
        payload:
          additionalProperties: true
          type: object
    x-cosalette-archetype: command
    x-cosalette-summary: Set hot water temperature and timer schedules
  hot_waterState:
    address: vito2mqtt/hot_water/state
    messages:
      message:
        payload:
          oneOf:
          - properties:
              hot_water_temperature:
                title: Hot Water Temperature
                type: number
                x-cosalette-consumer:
                  display_name: Hot Water Temperature
                  device_class: temperature
                  unit: °C
                  state_class: measurement
              hot_water_outlet_temperature:
                title: Hot Water Outlet Temperature
                type: number
                x-cosalette-consumer:
                  display_name: Hot Water Outlet Temperature
                  device_class: temperature
                  unit: °C
                  state_class: measurement
            required:
            - hot_water_temperature
            - hot_water_outlet_temperature
            title: HotWaterState
            type: object
          - anyOf: *id001
    x-cosalette-archetype: telemetry
    x-cosalette-app: vito2mqtt
    x-cosalette-summary: Read hot water temperature sensors via Optolink serial
  legionellaState:
    address: vito2mqtt/legionella/state
    messages:
      message:
        payload:
          type: object
    x-cosalette-archetype: device
  outdoorState:
    address: vito2mqtt/outdoor/state
    messages:
      message:
        payload:
          properties:
            outdoor_temperature:
              title: Outdoor Temperature
              type: number
              x-cosalette-consumer:
                display_name: Outdoor Temperature
                device_class: temperature
                unit: °C
                state_class: measurement
            outdoor_temperature_lowpass:
              title: Outdoor Temperature Lowpass
              type: number
              x-cosalette-consumer:
                display_name: Outdoor Temperature (Low-pass)
                device_class: temperature
                unit: °C
                state_class: measurement
            outdoor_temperature_damped:
              title: Outdoor Temperature Damped
              type: number
              x-cosalette-consumer:
                display_name: Outdoor Temperature (Damped)
                device_class: temperature
                unit: °C
                state_class: measurement
          required:
          - outdoor_temperature
          - outdoor_temperature_lowpass
          - outdoor_temperature_damped
          title: OutdoorState
          type: object
    x-cosalette-archetype: telemetry
    x-cosalette-app: vito2mqtt
    x-cosalette-summary: Read outdoor temperature sensors via Optolink serial
  systemCommand:
    address: vito2mqtt/system/set
    messages:
      message:
        payload:
          additionalProperties: true
          type: object
    x-cosalette-archetype: command
    x-cosalette-summary: Set Vitotronic system operational parameters
  systemState:
    address: vito2mqtt/system/state
    messages:
      message:
        payload:
          oneOf:
          - properties:
              storage_temperature_lowpass:
                title: Storage Temperature Lowpass
                type: number
                x-cosalette-consumer:
                  display_name: Storage Temperature (Low-pass)
                  device_class: temperature
                  unit: °C
                  state_class: measurement
              internal_pump_status:
                title: Internal Pump Status
                type: string
              internal_pump_speed:
                title: Internal Pump Speed
                type: integer
                x-cosalette-consumer:
                  display_name: Internal Pump Speed
                  unit: "%"
                  state_class: measurement
                  icon: "mdi:pump"
              storage_charge_pump_status:
                title: Storage Charge Pump Status
                type: string
              circulation_pump_status:
                title: Circulation Pump Status
                type: string
              switch_valve_status:
                title: Switch Valve Status
                type: string
              flow_temperature_setpoint_m3:
                title: Flow Temperature Setpoint M3
                type: number
                x-cosalette-consumer:
                  display_name: Flow Temperature Setpoint M3
                  device_class: temperature
                  unit: °C
                  state_class: measurement
            required:
            - storage_temperature_lowpass
            - internal_pump_status
            - internal_pump_speed
            - storage_charge_pump_status
            - circulation_pump_status
            - switch_valve_status
            - flow_temperature_setpoint_m3
            title: SystemState
            type: object
          - anyOf: *id001
    x-cosalette-archetype: telemetry
    x-cosalette-app: vito2mqtt
    x-cosalette-summary: Read Vitotronic system status and operational parameters
      via Optolink serial
operations:
  publishBurnerState:
    action: send
    channel:
      $ref: '#/channels/burnerState'
    summary: Read burner temperature, modulation and runtime data via Optolink serial
  publishDiagnosisState:
    action: send
    channel:
      $ref: '#/channels/diagnosisState'
    summary: Read diagnostic error codes and system health data via Optolink serial
  publishHeatingFloorState:
    action: send
    channel:
      $ref: '#/channels/heating_floorState'
    summary: Read floor heating circuit temperatures and pump status via Optolink
      serial
  publishHeatingRadiatorState:
    action: send
    channel:
      $ref: '#/channels/heating_radiatorState'
    summary: Read radiator heating circuit temperatures and pump status via Optolink
      serial
  publishHotWaterState:
    action: send
    channel:
      $ref: '#/channels/hot_waterState'
    summary: Read hot water temperature sensors via Optolink serial
  publishLegionellaState:
    action: send
    channel:
      $ref: '#/channels/legionellaState'
  publishOutdoorState:
    action: send
    channel:
      $ref: '#/channels/outdoorState'
    summary: Read outdoor temperature sensors via Optolink serial
  publishSystemState:
    action: send
    channel:
      $ref: '#/channels/systemState'
    summary: Read Vitotronic system status and operational parameters via Optolink
      serial
  receiveHeatingFloorCommand:
    action: receive
    channel:
      $ref: '#/channels/heating_floorCommand'
    summary: Set floor heating circuit temperatures and schedules
  receiveHeatingRadiatorCommand:
    action: receive
    channel:
      $ref: '#/channels/heating_radiatorCommand'
    summary: Set radiator heating circuit temperatures and schedules
  receiveHotWaterCommand:
    action: receive
    channel:
      $ref: '#/channels/hot_waterCommand'
    summary: Set hot water temperature and timer schedules
  receiveSystemCommand:
    action: receive
    channel:
      $ref: '#/channels/systemCommand'
    summary: Set Vitotronic system operational parameters
components:
  schemas:
    ErrorHistoryEntry:
      properties:
        error:
          title: Error
          type: string
        timestamp:
          title: Timestamp
          type: string
      required:
      - error
      - timestamp
      title: ErrorHistoryEntry
      type: object
x-cosalette-enforcement:
  mode: warn
  on_configure: true
  on_publish: false
  network_level: false

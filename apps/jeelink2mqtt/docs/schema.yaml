asyncapi: 3.0.0
info:
  title: jeelink2mqtt
  version: 0.1.3
  x-cosalette-contract-version: '1'
channels:
  mappingCommand:
    address: jeelink2mqtt/mapping/set
    x-cosalette-app: jeelink2mqtt
    messages:
      message:
        payload:
          type: object
    x-cosalette-archetype: command
    x-cosalette-summary: Return recently-seen sensor IDs that are not yet mapped
  mappingState:
    address: jeelink2mqtt/mapping/state
    x-cosalette-app: jeelink2mqtt
    messages:
      message:
        payload:
          additionalProperties: true
          type: object
    x-cosalette-archetype: command
    x-cosalette-summary: Manually assign an ephemeral sensor ID to a logical name
  officeState:
    address: jeelink2mqtt/office/state
    x-cosalette-app: jeelink2mqtt
    messages:
      message:
        payload:
          description: 'Contract for the per-sensor ``{name}/state`` retained payload.


            Declared as ``state_model=`` on the ``sensor_entity`` device

            (:mod:`jeelink2mqtt.main`) so every ``ctx.publish_state()`` call is

            validated and normalised against this shape (ADR-046).'
          properties: &id001
            temperature:
              title: Temperature
              type: number
            humidity:
              title: Humidity
              type: integer
            low_battery:
              title: Low Battery
              type: boolean
            timestamp:
              format: date-time
              title: Timestamp
              type: string
          required: &id002
          - temperature
          - humidity
          - low_battery
          - timestamp
          title: SensorStateModel
          type: object
    x-cosalette-archetype: device
    x-cosalette-summary: 'Per-sensor state publisher: calibrated readings, heartbeat
      re-publish, and staleness availability'
  outdoorState:
    address: jeelink2mqtt/outdoor/state
    x-cosalette-app: jeelink2mqtt
    messages:
      message:
        payload:
          description: 'Contract for the per-sensor ``{name}/state`` retained payload.


            Declared as ``state_model=`` on the ``sensor_entity`` device

            (:mod:`jeelink2mqtt.main`) so every ``ctx.publish_state()`` call is

            validated and normalised against this shape (ADR-046).'
          properties: *id001
          required: *id002
          title: SensorStateModel
          type: object
    x-cosalette-archetype: device
    x-cosalette-summary: 'Per-sensor state publisher: calibrated readings, heartbeat
      re-publish, and staleness availability'
  receiverState:
    address: jeelink2mqtt/state
    x-cosalette-app: jeelink2mqtt
    messages:
      message:
        payload:
          type: object
    x-cosalette-archetype: stream
    x-cosalette-summary: 'JeeLink LaCrosse serial receiver: read sensor frames and
      publish state'
operations:
  publishMappingState:
    action: send
    channel:
      $ref: '#/channels/mappingState'
    summary: Manually assign an ephemeral sensor ID to a logical name
  publishOfficeState:
    action: send
    channel:
      $ref: '#/channels/officeState'
    summary: 'Per-sensor state publisher: calibrated readings, heartbeat re-publish,
      and staleness availability'
  publishOutdoorState:
    action: send
    channel:
      $ref: '#/channels/outdoorState'
    summary: 'Per-sensor state publisher: calibrated readings, heartbeat re-publish,
      and staleness availability'
  publishReceiverState:
    action: send
    channel:
      $ref: '#/channels/receiverState'
    summary: 'JeeLink LaCrosse serial receiver: read sensor frames and publish state'
  receiveMappingCommand:
    action: receive
    channel:
      $ref: '#/channels/mappingCommand'
    summary: Return recently-seen sensor IDs that are not yet mapped
x-cosalette-enforcement:
  mode: warn
  on_configure: true
  on_publish: false
  network_level: false

services:
  jeelink2mqtt:
    build:
      context: ../..
      dockerfile: apps/jeelink2mqtt/Dockerfile
    image: ghcr.io/ff-fab/jeelink2mqtt:latest
    restart: unless-stopped
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0
    env_file: .env
    environment:
      JEELINK2MQTT_SERIAL_PORT: /dev/ttyUSB0
      JEELINK2MQTT_MQTT__HOST: mosquitto
      # Broker terminates plaintext MQTT; see docs/adr/ADR-006.
      JEELINK2MQTT_MQTT__TLS: ${JEELINK2MQTT_MQTT__TLS:-false}
      # MQTT 5 retained-message expiry; the bundled mosquitto:2 supports it.
      # Set to 3.1.1 for a broker without MQTT 5; see docs/adr/ADR-009.
      JEELINK2MQTT_MQTT__PROTOCOL_VERSION: ${JEELINK2MQTT_MQTT__PROTOCOL_VERSION:-5}
      JEELINK2MQTT_STORE_PATH: ${JEELINK2MQTT_STORE_PATH:-/app/data/store.json}
    volumes:
      - jeelink2mqtt-data:/app/data
    depends_on:
      - mosquitto

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - '127.0.0.1:1883:1883'
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log

volumes:
  jeelink2mqtt-data:
  mosquitto-data:
  mosquitto-log:

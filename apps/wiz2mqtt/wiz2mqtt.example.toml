# Example WiZ bulb inventory for wiz2mqtt.
#
# Copy this file to wiz2mqtt.toml (gitignored) and fill in real IPs.
# Note the destination filename is `wiz2mqtt.toml`, not this file's name —
# cosalette's config-file loader dispatches on the literal `.toml` suffix.
# This file holds the bulb and group inventory — everything else (MQTT broker,
# logging, etc.) is configured via .env. See .env.example.

[[bulbs]]
name = "desk"
ip = "192.168.1.101"

[[bulbs]]
name = "living-room"
ip = "192.168.1.102"
mac = "a8bb5006033d"

[[bulbs]]
name = "hallway"
ip = "192.168.1.103"

[[bulbs]]
name = "sauna"
ip = "192.168.1.104"
mac = "a8bb5006033e"

# Consumer-side fan-out; members must match bulb names above.
[[groups]]
name = "downstairs"
members = ["desk", "living-room", "hallway"]

# A bulb behind a switched relay that stops answering most likely has no mains
# power. when_unreachable = "no_power" keeps it online and publishes its desired
# state with powered: false; the default "fault" marks it offline instead.
# See docs/configuration.md > Power Sources.
[[power_sources]]
name = "hallway-power"
members = ["hallway"]
when_unreachable = "no_power"

[[power_sources]]
name = "sauna-power"
members = ["sauna"]
when_unreachable = "no_power"

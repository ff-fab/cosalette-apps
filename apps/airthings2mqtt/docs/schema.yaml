asyncapi: 3.0.0
info:
  title: airthings2mqtt
  version: 0.3.2 # x-release-please-version
  x-cosalette-contract-version: '2'
channels:
  airthingsAvailability:
    address: airthings2mqtt/airthings/availability
    x-cosalette-app: airthings2mqtt
    messages:
      message:
        payload:
          type: string
          enum:
          - online
          - offline
    bindings:
      mqtt:
        qos: 1
        retain: true
    x-cosalette-framework: availability
    x-cosalette-discoverable: false
  airthingsState:
    address: airthings2mqtt/airthings/state
    x-cosalette-app: airthings2mqtt
    messages:
      message:
        payload:
          properties:
            temperature:
              title: Temperature
              type: number
              x-cosalette-consumer:
                device_class: temperature
                unit: °C
                state_class: measurement
            humidity:
              title: Humidity
              type: number
              x-cosalette-consumer:
                device_class: humidity
                unit: '%'
                state_class: measurement
            radon_24h_avg:
              anyOf:
              - type: integer
              - type: 'null'
              title: Radon 24H Avg
              x-cosalette-consumer:
                display_name: Radon (24h avg)
                unit: Bq/m³
                state_class: measurement
                icon: mdi:radioactive
            radon_long_term_avg:
              anyOf:
              - type: integer
              - type: 'null'
              title: Radon Long Term Avg
              x-cosalette-consumer:
                display_name: Radon (long-term avg)
                unit: Bq/m³
                state_class: measurement
                icon: mdi:radioactive
            last_read:
              format: date-time
              title: Last Read
              type: string
              x-cosalette-consumer:
                display_name: Last read
                device_class: timestamp
              x-cosalette-ha-discovery:
                extra:
                  entity_category: diagnostic
              x-cosalette-openhab:
                channel_type: datetime
                item_type: DateTime
            rssi:
              anyOf:
              - type: integer
              - type: 'null'
              default: null
              title: Rssi
              x-cosalette-consumer:
                display_name: Signal strength
                device_class: signal_strength
                unit: dBm
                state_class: measurement
              x-cosalette-ha-discovery:
                extra:
                  entity_category: diagnostic
            measurement_state:
              default: ok
              enum:
              - warming_up
              - provisional
              - ok
              title: Measurement State
              type: string
              x-cosalette-consumer:
                display_name: Measurement state
                device_class: enum
              x-cosalette-ha-discovery:
                extra:
                  entity_category: diagnostic
                  options:
                  - warming_up
                  - provisional
                  - ok
            sensor_reset_at:
              anyOf:
              - format: date-time
                type: string
              - type: 'null'
              default: null
              title: Sensor Reset At
              x-cosalette-consumer:
                display_name: Sensor reset
                device_class: timestamp
              x-cosalette-ha-discovery:
                extra:
                  entity_category: diagnostic
              x-cosalette-openhab:
                channel_type: datetime
                item_type: DateTime
          required:
          - temperature
          - humidity
          - radon_24h_avg
          - radon_long_term_avg
          title: AirthingsReading
          type: object
    x-cosalette-archetype: telemetry
    x-cosalette-summary: Read Airthings BLE sensor values (temperature, humidity,
      radon)
operations:
  publishAirthingsAvailability:
    action: send
    channel:
      $ref: '#/channels/airthingsAvailability'
  publishAirthingsState:
    action: send
    channel:
      $ref: '#/channels/airthingsState'
    summary: Read Airthings BLE sensor values (temperature, humidity, radon)
x-cosalette-enforcement:
  mode: warn
  on_configure: true
  on_publish: false
  network_level: false

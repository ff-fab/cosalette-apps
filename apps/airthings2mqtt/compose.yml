services:
  airthings2mqtt:
    build:
      context: ../..
      dockerfile: apps/airthings2mqtt/Dockerfile
    image: ghcr.io/ff-fab/airthings2mqtt:latest
    # MQTT carries health; the image probe only shows it on the host and there is
    # no compose healthcheck (docs/adr/ADR-011). The restart policy recovers every
    # non-zero exit, e.g. 5 for a stale sensor and 6 for a stalled event loop.
    restart: unless-stopped
    # BLE requires access to the host Bluetooth stack via D-Bus.
    # network_mode: host is the simplest approach on a Raspberry Pi.
    network_mode: host
    # D-Bus needs no extra capabilities. The non-root user has none, and
    # no-new-privileges stops it gaining any. See docs/host-setup.md.
    security_opt:
      - no-new-privileges:true
    env_file: .env
    environment:
      # With network_mode: host, use localhost (or the IP of your broker)
      AIRTHINGS2MQTT_MQTT__HOST: localhost
      # Broker terminates plaintext MQTT; see docs/adr/ADR-006.
      AIRTHINGS2MQTT_MQTT__TLS: ${AIRTHINGS2MQTT_MQTT__TLS:-false}
      # MQTT 5 retained-message expiry; the bundled mosquitto:2 supports it.
      # Set to 3.1.1 for a broker without MQTT 5; see docs/adr/ADR-009.
      AIRTHINGS2MQTT_MQTT__PROTOCOL_VERSION: ${AIRTHINGS2MQTT_MQTT__PROTOCOL_VERSION:-5}
      AIRTHINGS2MQTT_STORE_PATH: /app/data/store.json
      # Exit 6 if the event loop stalls; bleak and D-Bus calls are async, so
      # nothing should block it. See docs/troubleshooting.md.
      COSALETTE_LOOP_STALL_TIMEOUT: ${COSALETTE_LOOP_STALL_TIMEOUT:-120}
      # AIRTHINGS2MQTT_DEVICE_MAC: "XX:XX:XX:XX:XX:XX"
      # AIRTHINGS2MQTT_POLL_INTERVAL: "1500"
      # AIRTHINGS2MQTT_EXIT_AFTER_STALE: "18000"
    volumes:
      - airthings2mqtt-data:/app/data
      # D-Bus socket for BlueZ communication
      - /var/run/dbus:/var/run/dbus:ro
    depends_on:
      - mosquitto

  # --- Multi-device example (uncomment and duplicate as needed) ---
  # Every instance needs its own topic prefix and device name, and every added
  # instance its own instance ID (Home Assistant identity). Instances that
  # share a prefix share the retained {prefix}/status heartbeat and its LWT, so
  # one instance going offline marks the other offline too. Do not set
  # AIRTHINGS2MQTT_MQTT__CLIENT_ID in the shared .env; set it per service.
  # airthings2mqtt-bedroom:
  #   image: ghcr.io/ff-fab/airthings2mqtt:latest
  #   restart: unless-stopped
  #   network_mode: host
  #   security_opt:
  #     - no-new-privileges:true
  #   env_file: .env
  #   environment:
  #     AIRTHINGS2MQTT_MQTT__HOST: localhost
  #     AIRTHINGS2MQTT_MQTT__TLS: ${AIRTHINGS2MQTT_MQTT__TLS:-false}
  #     AIRTHINGS2MQTT_MQTT__PROTOCOL_VERSION: ${AIRTHINGS2MQTT_MQTT__PROTOCOL_VERSION:-5}
  #     AIRTHINGS2MQTT_MQTT__TOPIC_PREFIX: airthings2mqtt-bedroom
  #     AIRTHINGS2MQTT_MQTT__INSTANCE_ID: airthings_bedroom
  #     AIRTHINGS2MQTT_STORE_PATH: /app/data/store.json
  #     COSALETTE_LOOP_STALL_TIMEOUT: ${COSALETTE_LOOP_STALL_TIMEOUT:-120}
  #     AIRTHINGS2MQTT_DEVICE_MAC: "AA:BB:CC:DD:EE:FF"
  #     AIRTHINGS2MQTT_DEVICE_NAME: "bedroom"
  #   volumes:
  #     - airthings2mqtt-bedroom-data:/app/data
  #     - /var/run/dbus:/var/run/dbus:ro
  #   depends_on:
  #     - mosquitto

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - '127.0.0.1:1883:1883'
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log

volumes:
  airthings2mqtt-data:
  # airthings2mqtt-bedroom-data:
  mosquitto-data:
  mosquitto-log:

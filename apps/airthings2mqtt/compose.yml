services:
  airthings2mqtt:
    build:
      context: ../..
      dockerfile: apps/airthings2mqtt/Dockerfile
    image: ghcr.io/ff-fab/airthings2mqtt:latest
    restart: unless-stopped
    # BLE requires access to the host Bluetooth stack via D-Bus.
    # network_mode: host is the simplest approach on a Raspberry Pi.
    network_mode: host
    # D-Bus needs no extra capabilities. The non-root user has none, and
    # no-new-privileges stops it gaining any. See docs/host-setup.md.
    security_opt:
      - no-new-privileges:true
    env_file: .env
    environment:
      # With network_mode: host, use localhost (or the IP of your broker)
      AIRTHINGS2MQTT_MQTT__HOST: localhost
      # Broker terminates plaintext MQTT; see docs/adr/ADR-006.
      AIRTHINGS2MQTT_MQTT__TLS: ${AIRTHINGS2MQTT_MQTT__TLS:-false}
      # MQTT 5 retained-message expiry; the bundled mosquitto:2 supports it.
      # Set to 3.1.1 for a broker without MQTT 5; see docs/adr/ADR-009.
      AIRTHINGS2MQTT_MQTT__PROTOCOL_VERSION: ${AIRTHINGS2MQTT_MQTT__PROTOCOL_VERSION:-5}
      AIRTHINGS2MQTT_STORE_PATH: /app/data/store.json
      # AIRTHINGS2MQTT_DEVICE_MAC: "XX:XX:XX:XX:XX:XX"
      # AIRTHINGS2MQTT_POLL_INTERVAL: "1500"
    volumes:
      - airthings2mqtt-data:/app/data
      # D-Bus socket for BlueZ communication
      - /var/run/dbus:/var/run/dbus:ro
    depends_on:
      - mosquitto
    # Same probe as the image HEALTHCHECK. Docker only reports "unhealthy"; it
    # never restarts on it. Append `--fail-on stale --fail-on error` to the test to
    # also flag a failing read (a bare `--fail-on error` would drop `stale`).
    # Needs image 0.3.0 or later. Older images have no `health` command and start
    # a second app instance instead (same client ID if MQTT__CLIENT_ID is set).
    # See docs/host-setup.md. The probe imports the app, which takes several seconds
    # on a Raspberry Pi, hence the 30s timeout.
    healthcheck:
      test: ['CMD', 'airthings2mqtt', 'health']
      interval: 60s
      timeout: 30s
      start_period: 180s
      retries: 3

  # --- Multi-device example (uncomment and duplicate as needed) ---
  # airthings2mqtt-bedroom:
  #   image: ghcr.io/ff-fab/airthings2mqtt:latest
  #   restart: unless-stopped
  #   network_mode: host
  #   security_opt:
  #     - no-new-privileges:true
  #   env_file: .env
  #   environment:
  #     AIRTHINGS2MQTT_MQTT__HOST: localhost
  #     AIRTHINGS2MQTT_MQTT__TLS: ${AIRTHINGS2MQTT_MQTT__TLS:-false}
  #     AIRTHINGS2MQTT_MQTT__PROTOCOL_VERSION: ${AIRTHINGS2MQTT_MQTT__PROTOCOL_VERSION:-5}
  #     AIRTHINGS2MQTT_DEVICE_MAC: "AA:BB:CC:DD:EE:FF"
  #     AIRTHINGS2MQTT_DEVICE_NAME: "bedroom"
  #   volumes:
  #     - airthings2mqtt-bedroom-data:/app/data
  #     - /var/run/dbus:/var/run/dbus:ro
  #   depends_on:
  #     - mosquitto

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - '127.0.0.1:1883:1883'
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log

volumes:
  airthings2mqtt-data:
  # airthings2mqtt-bedroom-data:
  mosquitto-data:
  mosquitto-log:

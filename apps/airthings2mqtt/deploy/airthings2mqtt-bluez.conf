<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  Opt-in host D-Bus policy for airthings2mqtt (ADR-003).

  Install as /etc/dbus-1/system.d/airthings2mqtt-bluez.conf on the Docker host.
  It denies org.freedesktop.DBus.Properties.Set on BlueZ for the container's
  dedicated UID 10001 only, so the app cannot change Adapter1.Powered (or any
  other BlueZ property). Reads, scans, connections, GATT and signals stay allowed.
  Keep the UID in sync with the image (Dockerfile `adduser -u`).
  See docs/host-setup.md for install, reload and verification.
-->
<busconfig>
  <policy user="10001">
    <deny send_destination="org.bluez"
          send_interface="org.freedesktop.DBus.Properties"
          send_member="Set"/>
  </policy>
</busconfig>

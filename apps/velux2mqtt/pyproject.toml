[project]
name = "velux2mqtt"
version = "0.2.1"
description = "Control Velux covers via KLF 050 remotes and M74HC4066 GPIO switches"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [
    { name = "Fabian Koerner", email = "mail@fabiankoerner.com" }
]

dependencies = [
    "cosalette[schema]>=0.9.5,<0.10",
    "gpiozero>=2.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
]

[project.scripts]
velux2mqtt = "velux2mqtt.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packages/src/velux2mqtt"]

[tool.pytest.ini_options]
testpaths = ["packages/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Shared cross-app test helpers (packages/tests/fixtures/ at the repo root);
# resolved relative to this app's rootdir. See cap-51s.
pythonpath = ["../../packages/tests/fixtures"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "unit: Unit tests (fast, no external dependencies)",
    "integration: Integration tests (require mock servers)",
    "slow: Tests that take > 1 second",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["packages/src/velux2mqtt"]
branch = true
omit = [
    "*/__pycache__/*",
    "*/tests/*",
    "*/main.py",
    "*/app.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
    "def __repr__",
    'if __name__ == "__main__":',
    "^\\s*\\.\\.\\.$",
]
fail_under = 80
show_missing = true
skip_covered = false

[tool.coverage.json]
output = "coverage.json"

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

# Inherit root's [tool.ruff] select and rule config; see the rationale
# comment on root pyproject.toml's [tool.ruff] table (cap-4lc).
[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint.isort]
# ``ha_discovery`` is the repo-root shared test helper reached via
# ``pythonpath`` above, not a PyPI package.
known-first-party = ["velux2mqtt", "ha_discovery"]

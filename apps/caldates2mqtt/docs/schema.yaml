asyncapi: 3.0.0
info:
  title: caldates2mqtt
  version: 0.1.4
  x-cosalette-contract-version: '1'
channels:
  calendarState:
    address: caldates2mqtt/calendar/state
    x-cosalette-app: caldates2mqtt
    messages:
      message:
        payload:
          properties:
            events:
              items:
                $ref: '#/components/schemas/CalendarEvent'
              title: Events
              type: array
          required:
          - events
          title: CalendarState
          type: object
    x-cosalette-archetype: telemetry
operations:
  publishCalendarState:
    action: send
    channel:
      $ref: '#/channels/calendarState'
components:
  schemas:
    CalendarEvent:
      properties:
        title:
          title: Title
          type: string
          x-cosalette-consumer:
            display_name: Event Title
        date:
          title: Date
          type: string
          x-cosalette-consumer:
            display_name: Event Date
      required:
      - title
      - date
      title: CalendarEvent
      type: object
x-cosalette-enforcement:
  mode: warn
  on_configure: true
  on_publish: false
  network_level: false

asyncapi: 3.0.0
info:
  title: caldates2mqtt
  version: 0.2.10 # x-release-please-version
  x-cosalette-contract-version: '2'
channels:
  birthdayAvailability:
    address: caldates2mqtt/birthday/availability
    x-cosalette-app: caldates2mqtt
    messages:
      message:
        payload:
          type: string
          enum:
          - online
          - offline
    bindings:
      mqtt:
        qos: 1
        retain: true
    x-cosalette-framework: availability
    x-cosalette-discoverable: false
  birthdayState:
    address: caldates2mqtt/birthday/state
    x-cosalette-app: caldates2mqtt
    messages:
      message:
        payload:
          properties: &id001
            events:
              items:
                $ref: '#/components/schemas/CalendarEvent'
              title: Events
              type: array
              x-cosalette-consumer:
                display_name: Upcoming Events
                unit: events
                aggregate: count
          required: &id002
          - events
          title: CalendarState
          type: object
          x-cosalette-ha-discovery: &id003
            entities:
            - component: sensor
              extra:
                icon: mdi:calendar
                json_attributes_template: '{{ {''events'': value_json.events} | tojson
                  }}'
                state_class: measurement
                unit_of_measurement: events
                value_template: '{{ value_json.events | length }}'
              name: Events
    x-cosalette-archetype: telemetry
  garbageAvailability:
    address: caldates2mqtt/garbage/availability
    x-cosalette-app: caldates2mqtt
    messages:
      message:
        payload:
          type: string
          enum:
          - online
          - offline
    bindings:
      mqtt:
        qos: 1
        retain: true
    x-cosalette-framework: availability
    x-cosalette-discoverable: false
  garbageState:
    address: caldates2mqtt/garbage/state
    x-cosalette-app: caldates2mqtt
    messages:
      message:
        payload:
          properties: *id001
          required: *id002
          title: CalendarState
          type: object
          x-cosalette-ha-discovery: *id003
    x-cosalette-archetype: telemetry
operations:
  publishBirthdayAvailability:
    action: send
    channel:
      $ref: '#/channels/birthdayAvailability'
  publishBirthdayState:
    action: send
    channel:
      $ref: '#/channels/birthdayState'
  publishGarbageAvailability:
    action: send
    channel:
      $ref: '#/channels/garbageAvailability'
  publishGarbageState:
    action: send
    channel:
      $ref: '#/channels/garbageState'
components:
  schemas:
    CalendarEvent:
      properties:
        title:
          title: Title
          type: string
          x-cosalette-consumer:
            display_name: Event Title
        date:
          title: Date
          type: string
          x-cosalette-consumer:
            display_name: Event Date
      required:
      - title
      - date
      title: CalendarEvent
      type: object
x-cosalette-enforcement:
  mode: warn
  on_configure: true
  on_publish: false
  network_level: false

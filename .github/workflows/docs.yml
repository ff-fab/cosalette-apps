name: Documentation
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'zensical.toml'
      - 'apps/*/docs/**'
      - 'apps/*/zensical.toml'
  pull_request:
    paths:
      - 'docs/**'
      - 'zensical.toml'
      - 'apps/*/docs/**'
      - 'apps/*/zensical.toml'
  workflow_dispatch:

env:
  DEVCONTAINER_IMAGE: ghcr.io/ff-fab/cosalette-apps-devcontainer

permissions:
  contents: read
  packages: read

concurrency:
  group: pages-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      root: ${{ steps.result.outputs.root }}
      apps: ${{ steps.result.outputs.apps }}
      all_apps: ${{ steps.discover.outputs.apps }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Discover all apps that have a zensical.toml (i.e. have docs)
      - name: Discover doc-enabled apps
        id: discover
        run: |
          app_names=()
          for config in apps/*/zensical.toml; do
            [[ -f "$config" ]] || continue
            app=$(basename "$(dirname "$config")")
            if [[ ! "$app" =~ ^[a-z0-9][a-z0-9-]*$ ]]; then
              echo "::error::Rejected app name failing slug validation"
              exit 1
            fi
            app_names+=("$app")
          done
          apps=$(printf '%s\n' "${app_names[@]}" | jq -R -s -c 'split("\n") | map(select(. != ""))')
          echo "apps=$apps" >> "$GITHUB_OUTPUT"

      # Build dorny/paths-filter config dynamically from discovered apps
      - name: Build path filters
        id: build-filters
        env:
          DISCOVERED_APPS: ${{ steps.discover.outputs.apps }}
        run: |
          filters="root:"$'\n'"  - 'docs/**'"$'\n'"  - 'zensical.toml'"
          for app in $(printf '%s' "$DISCOVERED_APPS" | jq -r '.[]'); do
            filters="$filters"$'\n'"${app}:"$'\n'"  - 'apps/${app}/docs/**'"$'\n'"  - 'apps/${app}/zensical.toml'"
          done
          # Write to file to avoid quoting issues
          echo "$filters" > /tmp/path-filters.yml

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: /tmp/path-filters.yml

      # On workflow_dispatch: build everything (full rebuild / cache seed)
      # On push/pull_request: build only what changed
      - name: Resolve build targets
        id: result
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISCOVERED_APPS: ${{ steps.discover.outputs.apps }}
          FILTER_CHANGES: ${{ steps.filter.outputs.changes }}
          ROOT_CHANGED: ${{ steps.filter.outputs.root }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "root=true" >> "$GITHUB_OUTPUT"
            echo "apps=$DISCOVERED_APPS" >> "$GITHUB_OUTPUT"
          else
            apps=$(printf '%s' "$FILTER_CHANGES" | jq -c '[.[] | select(. != "root")]')
            root="$ROOT_CHANGED"
            echo "root=$root" >> "$GITHUB_OUTPUT"
            echo "apps=$apps" >> "$GITHUB_OUTPUT"
          fi

  build-root:
    needs: detect
    if: needs.detect.outputs.root == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build root docs inside devcontainer
        uses: ./.github/actions/devcontainer-run
        with:
          run-cmd: task docs:build
          token: ${{ secrets.GITHUB_TOKEN }}
          dockerhub-username: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && secrets.DOCKERHUB_USERNAME || '' }}
          dockerhub-token: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && secrets.DOCKERHUB_TOKEN || '' }}
      - name: Upload docs artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-root
          path: site
          retention-days: 1

  # Per-app docs dispatched via matrix — builds run fully parallel
  app-docs:
    needs: detect
    if: needs.detect.outputs.apps != '[]'
    strategy:
      matrix:
        app: ${{ fromJson(needs.detect.outputs.apps) }}
      fail-fast: false
    uses: ./.github/workflows/docs-app.yml
    with:
      app: ${{ matrix.app }}
    secrets:
      DOCKERHUB_USERNAME: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && secrets.DOCKERHUB_USERNAME || '' }}
      DOCKERHUB_TOKEN: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && secrets.DOCKERHUB_TOKEN || '' }}

  # Merge artifacts with cached site and deploy to GitHub Pages
  deploy:
    needs: [detect, build-root, app-docs]
    # Pages isn't available on private repos (free plan) — skip the deploy
    # there; the build jobs above still validate the docs.
    if: >-
      always() &&
      github.event_name != 'pull_request' &&
      github.event.repository.private == false &&
      needs.detect.result == 'success' &&
      needs.build-root.result != 'failure' &&
      needs.build-root.result != 'cancelled' &&
      needs.app-docs.result != 'failure' &&
      needs.app-docs.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # Restore the previously-deployed site as a base layer.
      # On workflow_dispatch every app is rebuilt so the cache is optional.
      # On push the cache is required — without it we cannot produce a full site.
      - name: Restore site cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: merged
          key: pages-site-will-never-match
          restore-keys: pages-site-

      - name: Require cache on incremental deploy
        if: steps.cache.outputs.cache-matched-key == '' && github.event_name != 'workflow_dispatch'
        run: |
          echo "::error::Site cache not found. Trigger a workflow_dispatch run to do a full rebuild and seed the cache."
          exit 1

      - name: Prepare merged site directory
        run: mkdir -p merged

      - name: Download freshly-built artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          pattern: docs-*
          path: artifacts

      - name: Overlay new artifacts onto site
        env:
          ALL_APPS: ${{ needs.detect.outputs.all_apps }}
        run: |
          for art_dir in artifacts/docs-*/; do
            [ -d "$art_dir" ] || continue
            name=$(basename "$art_dir" | sed 's/^docs-//')
            if [ "$name" = "root" ]; then
              # Root site — delete stale root files while preserving app subdirs.
              # Use the discovered app list (not merged/*/) to avoid excluding
              # root-owned directories like assets/ and stylesheets/.
              excludes=()
              for app in $(printf '%s' "$ALL_APPS" | jq -r '.[]'); do
                excludes+=("--exclude=$app")
              done
              rsync -a --delete --exclude='.*' "${excludes[@]}" "$art_dir" merged/
            else
              # App site — replace subpath entirely to remove stale pages
              rm -rf "merged/$name"
              mkdir -p "merged/$name"
              rsync -a --exclude='.*' "$art_dir" "merged/$name/"
            fi
          done

      - name: Save site cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: merged
          key: pages-site-${{ github.run_id }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: merged

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

# CodeQL static analysis — detects security vulnerabilities in Python code.
#
# Runs on:
#   - Push to main (catch issues post-merge)
#   - Pull requests to main (gate before merge)
#   - Weekly schedule (catch new vulnerability patterns in existing code)
#
# Free for public repositories. Python analysis uses the built-in extractor
# (no build step required).
#
# Path scope (cap-2ydw): the analysis reads only Python sources, so push and
# pull_request runs trigger on a *.py change or a change to this workflow. An
# app change without Python (compose, docs, Dockerfile) skips it. The weekly
# schedule still scans the whole tree. CodeQL is not a required check, so a
# skipped run never blocks a merge; ci-gate is the only required check.
#
# Skipped on private repositories: code scanning requires GitHub Advanced
# Security there, so the job would fail with a configuration error.

name: CodeQL

on:
  push:
    branches: [main]
    paths:
      - '**/*.py'
      - '.github/workflows/codeql.yml'
  pull_request:
    branches: [main]
    paths:
      - '**/*.py'
      - '.github/workflows/codeql.yml'
  schedule:
    # Weekly Monday 06:00 UTC — catches newly published vulnerability patterns
    - cron: '0 6 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze Python
    # Code scanning is only available on private repos with GitHub Advanced
    # Security — skip entirely for private repos.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: python
          queries: security-extended

      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: '/language:python'

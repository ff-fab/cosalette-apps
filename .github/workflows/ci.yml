name: CI
on:
  push:
    branches: [main]
  pull_request:

# Cancel in-progress runs for the same branch/PR — avoids wasting CI minutes
# on superseded commits when you push twice quickly.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DEVCONTAINER_IMAGE: ghcr.io/ff-fab/cosalette-apps-devcontainer

jobs:
  detect:
    # Skip full CI for release-please PRs — they only change changelogs and
    # version numbers, which were already tested on main. When detect is
    # skipped, shared and app-ci are skipped too, and ci-gate auto-passes.
    # The actor check prevents humans from bypassing CI by naming a branch
    # with the release-please-- prefix.
    if: >-
      github.event_name == 'push'
      || github.actor != 'ff-fab-release-bot[bot]'
      || !startsWith(github.head_ref, 'release-please--')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      apps: ${{ steps.apps.outputs.apps }}
      shared: ${{ steps.filter.outputs.shared }}
      root_tests: ${{ steps.scope.outputs.root_tests }}
      docker_lint: ${{ steps.scope.outputs.docker_lint }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Discover all apps from apps/*/pyproject.toml
      - name: Discover apps
        id: discover
        run: |
          # Use a glob loop (not ls|xargs) so directory names with spaces or
          # newlines are never word-split before validation (cap-8tf).
          app_names=()
          for pyproject in apps/*/pyproject.toml; do
            [[ -f "$pyproject" ]] || continue
            app_names+=("$(basename "$(dirname "$pyproject")")")
          done
          apps=$(printf '%s\n' "${app_names[@]}" | jq -R -s -c 'split("\n") | map(select(. != ""))')
          # Security (cap-8tf): app names flow into run-cmd strings in ci-app.yml
          # via GitHub Actions expression interpolation. Reject any name that is
          # not a strict slug before it can reach the matrix or a shell command.
          # Leading hyphens are also rejected (^[a-z0-9][a-z0-9-]*$) so names
          # cannot be mistaken for CLI flags downstream.
          invalid=$(printf '%s' "$apps" | jq -r '.[] | select(test("^[a-z0-9][a-z0-9-]*$") | not)')
          if [ -n "$invalid" ]; then
            echo "::error::Rejected app name(s) failing ^[a-z0-9][a-z0-9-]*$ pattern: $invalid"
            exit 1
          fi
          echo "apps=$apps" >> "$GITHUB_OUTPUT"

      # Build dorny/paths-filter config dynamically from discovered apps.
      # The shared list lives in .github/ci-shared-paths.txt, which
      # scripts/pre-pr-scope.sh reads too, so local and CI scoping agree.
      # `changed_paths` matches every file so its list feeds ci-scope.sh; the
      # underscore keeps it from colliding with an app slug.
      - name: Build path filters
        id: build-filters
        env:
          DISCOVERED_APPS: ${{ steps.discover.outputs.apps }}
        run: |
          filters="changed_paths:"$'\n'"  - '**'"$'\n'"shared:"
          while IFS= read -r pattern; do
            filters="$filters"$'\n'"  - '${pattern}'"
          done < <(sed -e 's/#.*//' -e 's/[[:space:]]*$//' -e '/^$/d' .github/ci-shared-paths.txt)
          for app in $(printf '%s' "$DISCOVERED_APPS" | jq -r '.[]'); do
            filters="$filters"$'\n'"${app}:"$'\n'"  - 'apps/${app}/**'"
          done
          echo "$filters" > /tmp/path-filters.yml

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: /tmp/path-filters.yml
          list-files: json

      # Root tests and Docker lint run only when their inputs changed; see
      # scripts/ci-scope.sh for the input surfaces. Pushes to main and shared
      # changes run both; the file list is then not passed, which keeps a
      # mass edit's list clear of the per-variable environment size limit.
      - name: Classify fixed-cost jobs
        id: scope
        env:
          CI_SCOPE_FULL: ${{ (github.event_name != 'pull_request' || steps.filter.outputs.shared == 'true') && '1' || '' }}
          CHANGED_FILES: ${{ github.event_name == 'pull_request' && steps.filter.outputs.shared != 'true' && steps.filter.outputs.changed_paths_files || '[]' }}
        run: jq -r '.[]' <<<"$CHANGED_FILES" | bash scripts/ci-scope.sh >> "$GITHUB_OUTPUT"

      - name: Build app list (exclude non-app filters)
        id: apps
        env:
          FILTER_CHANGES: ${{ steps.filter.outputs.changes }}
          SHARED_CHANGED: ${{ steps.filter.outputs.shared }}
          DISCOVERED_APPS: ${{ steps.discover.outputs.apps }}
        run: |
          # A shared change (uv.lock, root pyproject, shared fixtures under
          # packages/, taskfiles, ...) can break any app, so it runs every app.
          if [ "$SHARED_CHANGED" = "true" ]; then
            echo "apps=$DISCOVERED_APPS" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # dorny/paths-filter outputs a JSON array of all matched filter names.
          # Remove 'shared' and 'changed_paths' since they are not apps.
          apps=$(printf '%s' "$FILTER_CHANGES" | jq -c '[.[] | select(. != "shared" and . != "changed_paths")]')
          echo "apps=$apps" >> "$GITHUB_OUTPUT"

  # Shared infrastructure check (REUSE, agent-config integrity)
  shared:
    needs: detect
    if: needs.detect.outputs.shared == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run shared checks inside devcontainer
        uses: ./.github/actions/devcontainer-run
        with:
          run-cmd: task reuse:lint
          token: ${{ secrets.GITHUB_TOKEN }}
          dockerhub-username: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && secrets.DOCKERHUB_USERNAME || '' }}
          dockerhub-token: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && secrets.DOCKERHUB_TOKEN || '' }}
      - name: Check agent config integrity inside devcontainer
        uses: ./.github/actions/devcontainer-run
        with:
          run-cmd: task check:agents
          token: ${{ secrets.GITHUB_TOKEN }}
          dockerhub-username: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && secrets.DOCKERHUB_USERNAME || '' }}
          dockerhub-token: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && secrets.DOCKERHUB_TOKEN || '' }}
      - name: Run agent-config script test suite inside devcontainer
        uses: ./.github/actions/devcontainer-run
        with:
          run-cmd: task check:agents:test
          token: ${{ secrets.GITHUB_TOKEN }}
          dockerhub-username: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && secrets.DOCKERHUB_USERNAME || '' }}
          dockerhub-token: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && secrets.DOCKERHUB_TOKEN || '' }}

  # Repo-root unit and script regression suites (cap-890, cap-w1cr).
  # Framework-contract and cross-app-convention tests (e.g. the ADR-006 MQTT
  # TLS posture check reads every app's compose.yml/.env.example), plus shell
  # helper tests, can be broken by app-scoped changes without touching the
  # `shared` path filter above, so any app runtime change runs them. `task lint`
  # also runs here: ruff on the root package and scripts/, shellcheck on every
  # tracked *.sh (some, like .devcontainer/*.sh, sit outside the shared list).
  # Skipped only when every changed path is inert (docs, Markdown, beads, app
  # tests or docs) — scripts/ci-scope.sh (cap-2ydw).
  root-tests:
    needs: detect
    if: needs.detect.result == 'success' && needs.detect.outputs.root_tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run repo-root lint, unit and script test suites inside devcontainer
        uses: ./.github/actions/devcontainer-run
        with:
          run-cmd: task lint && task test:unit && task test:scripts
          token: ${{ secrets.GITHUB_TOKEN }}
          dockerhub-username: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && secrets.DOCKERHUB_USERNAME || '' }}
          dockerhub-token: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && secrets.DOCKERHUB_TOKEN || '' }}

  # Security audit — runs on shared or app changes to catch workflow/dep/source issues
  security:
    needs: detect
    if: needs.detect.result == 'success' && (needs.detect.outputs.shared == 'true' || needs.detect.outputs.apps != '[]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run security audit inside devcontainer
        uses: ./.github/actions/devcontainer-run
        with:
          run-cmd: task security:audit
          token: ${{ secrets.GITHUB_TOKEN }}
          dockerhub-username: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && secrets.DOCKERHUB_USERNAME || '' }}
          dockerhub-token: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && secrets.DOCKERHUB_TOKEN || '' }}

  # Release Please reads its PR body back as HTML; a bare <PREFIX> in a commit
  # header or BREAKING CHANGE note silently skipped eight app releases
  # (cap-fowo). Checks the PR title, any BEGIN_COMMIT_OVERRIDE block and the
  # PR's commits on every PR except Release Please's own.
  release-notes-markup:
    if: >-
      github.event_name == 'pull_request'
      && (github.actor != 'ff-fab-release-bot[bot]'
          || !startsWith(github.head_ref, 'release-please--'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reject HTML-like tags in text bound for release notes
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          {
            printf '%s\n\n' "$PR_TITLE"
            tr -d '\r' <<<"$PR_BODY" | sed -n '/^BEGIN_COMMIT_OVERRIDE/,/^END_COMMIT_OVERRIDE/p'
            echo
            git log --format='%B' "$BASE_SHA..$HEAD_SHA"
          } | bash scripts/check-release-notes-markup.sh

  # hadolint over every Dockerfile (cap-jrpf). Runs on the runner, not inside
  # the devcontainer, because it needs the Docker daemon. Runs when a
  # Dockerfile (the devcontainer's included), .hadolint.yaml or a shared path
  # changed — scripts/ci-scope.sh (cap-2ydw).
  docker-lint:
    needs: detect
    if: needs.detect.result == 'success' && needs.detect.outputs.docker_lint == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.52.0
          checksum: 02c679ffae53dca791804847d78b31731615894e292948397c971c87ac9e95bd # pragma: allowlist secret
      - name: Lint Dockerfiles with hadolint
        run: task docker:lint

  # Per-app CI dispatched via matrix
  app-ci:
    needs: detect
    if: needs.detect.result == 'success' && needs.detect.outputs.apps != '[]'
    strategy:
      matrix:
        app: ${{ fromJson(needs.detect.outputs.apps) }}
      fail-fast: false
    # A reusable-workflow call job's effective token permissions are capped by
    # its own job-level permissions (defaulting to the workflow top-level
    # otherwise) — ci-app.yml's jobs need packages: read to pull the
    # devcontainer image, so it must be granted here explicitly now that the
    # workflow-level default above is the more restrictive contents: read.
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/ci-app.yml
    with:
      app: ${{ matrix.app }}
    secrets:
      DOCKERHUB_USERNAME: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && secrets.DOCKERHUB_USERNAME || '' }}
      DOCKERHUB_TOKEN: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && secrets.DOCKERHUB_TOKEN || '' }}

  # Merge gate — the single required status check for branch protection.
  # Always runs; passes when every upstream job succeeded or was skipped, and
  # fails when any failed or was cancelled. detect is a need too: if it fails,
  # everything downstream is skipped and must not read as a pass. Skips are
  # safe because ci-scope.sh and the paths-filter only skip a job whose inputs
  # did not change; the release-please skip of detect is the one intended
  # whole-run skip.
  ci-gate:
    needs: [detect, shared, security, app-ci, root-tests, docker-lint, release-notes-markup]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check upstream results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          failed=$(jq -r 'to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | "\(.key): \(.value.result)"' <<<"$NEEDS")
          if [ -n "$failed" ]; then
            printf '%s\n' "$failed"
            exit 1
          fi
          echo "All checks passed or were skipped"

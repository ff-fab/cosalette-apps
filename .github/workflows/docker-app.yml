name: Docker Build (per-app)
on:
  workflow_call:
    inputs:
      app:
        required: true
        type: string
      version:
        required: true
        type: string
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true
  # Manual rebuild of an already-released image (e.g. after a failed release
  # build): gh workflow run docker-app.yml -f app=<app> -f version=<x.y.z>
  workflow_dispatch:
    inputs:
      app:
        required: true
        type: string
      version:
        required: true
        type: string

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A manual rebuild builds the release tag, not the dispatch ref.
          ref: ${{ github.event_name == 'workflow_dispatch' && format('{0}-v{1}', inputs.app, inputs.version) || '' }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # Anonymous Docker Hub pulls from shared runners hit 429 rate limits
          # (release run 37990075476). Resolve docker.io images through
          # Google's public pull-through mirror first; BuildKit falls back to
          # docker.io when the mirror misses. The BuildKit daemon image itself
          # is pulled by the Docker engine, not BuildKit, so it needs the
          # mirror spelled out (rerun attempt 4 timed out on docker.io here).
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Authenticated docker.io pulls for mirror misses: anonymous pulls hit
      # 429 rate limits on shared runners.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/${{ inputs.app }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/ff-fab/${{ inputs.app }}:${{ inputs.version }}
            ghcr.io/ff-fab/${{ inputs.app }}:latest
          cache-from: type=gha,scope=${{ inputs.app }}
          cache-to: type=gha,mode=max,scope=${{ inputs.app }}

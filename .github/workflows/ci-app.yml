name: CI (per-app)
on:
  workflow_call:
    inputs:
      app:
        required: true
        type: string
    # Optional: passed only on main push or main workflow_dispatch events.
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false

env:
  # Image reference used by the devcontainer-run composite action
  DEVCONTAINER_IMAGE: ghcr.io/ff-fab/cosalette-apps-devcontainer

concurrency:
  group: ci-${{ inputs.app }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint, typecheck and tests in one job (cap-4fbt): each job paid ~1.5-2 min
  # of checkout, cache and devcontainer setup for 20-40 s of work. Later steps
  # run even when an earlier one failed, so one run still reports every check.
  # ci-gate in ci.yml is the only required status check.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run linting inside devcontainer
        uses: ./.github/actions/devcontainer-run
        with:
          run-cmd: task ${{ inputs.app }}:lint
          token: ${{ secrets.GITHUB_TOKEN }}
          dockerhub-username: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && secrets.DOCKERHUB_USERNAME || '' }}
          dockerhub-token: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && secrets.DOCKERHUB_TOKEN || '' }}
      - name: Validate AsyncAPI schema inside devcontainer
        if: ${{ !cancelled() }}
        uses: ./.github/actions/devcontainer-run
        with:
          run-cmd: task ${{ inputs.app }}:schema:check
          token: ${{ secrets.GITHUB_TOKEN }}
          dockerhub-username: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && secrets.DOCKERHUB_USERNAME || '' }}
          dockerhub-token: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && secrets.DOCKERHUB_TOKEN || '' }}
      - name: Check complexity and duplication inside devcontainer
        if: ${{ !cancelled() }}
        uses: ./.github/actions/devcontainer-run
        with:
          run-cmd: task ${{ inputs.app }}:complexity && task ${{ inputs.app }}:similarity
          token: ${{ secrets.GITHUB_TOKEN }}
          dockerhub-username: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && secrets.DOCKERHUB_USERNAME || '' }}
          dockerhub-token: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && secrets.DOCKERHUB_TOKEN || '' }}
      - name: Run type checking inside devcontainer
        if: ${{ !cancelled() }}
        uses: ./.github/actions/devcontainer-run
        with:
          run-cmd: task ${{ inputs.app }}:typecheck
          token: ${{ secrets.GITHUB_TOKEN }}
          dockerhub-username: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && secrets.DOCKERHUB_USERNAME || '' }}
          dockerhub-token: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && secrets.DOCKERHUB_TOKEN || '' }}
      - name: Run unit tests inside devcontainer
        if: ${{ !cancelled() }}
        uses: ./.github/actions/devcontainer-run
        with:
          run-cmd: task ${{ inputs.app }}:ci:test:unit
          token: ${{ secrets.GITHUB_TOKEN }}
          dockerhub-username: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && secrets.DOCKERHUB_USERNAME || '' }}
          dockerhub-token: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && secrets.DOCKERHUB_TOKEN || '' }}
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: ${{ !cancelled() }}
        with:
          files: apps/${{ inputs.app }}/coverage.xml
          flags: ${{ inputs.app }}
      - name: Run integration tests inside devcontainer
        if: ${{ !cancelled() }}
        uses: ./.github/actions/devcontainer-run
        with:
          run-cmd: task ${{ inputs.app }}:ci:test:integration
          token: ${{ secrets.GITHUB_TOKEN }}
          dockerhub-username: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && secrets.DOCKERHUB_USERNAME || '' }}
          dockerhub-token: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && secrets.DOCKERHUB_TOKEN || '' }}

  # Build the app image and run its shipped console scripts offline
  # (cap-r352): --help alone returned before the code that broke wiz2mqtt
  # 0.2.13 (cap-f19s). Runs on the runner, not in the devcontainer, because it
  # needs the Docker daemon. amd64 only, loaded locally, never pushed.
  image-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # Same Docker Hub mirror as docker-app.yml: anonymous docker.io pulls
          # hit 429 rate limits on shared runners.
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/${{ inputs.app }}/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ inputs.app }}:smoke
          # Read the release build's cache; never write it from a PR.
          cache-from: type=gha,scope=${{ inputs.app }}
      - name: Install Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.52.0
          checksum: 02c679ffae53dca791804847d78b31731615894e292948397c971c87ac9e95bd # pragma: allowlist secret
      - name: Smoke-test the image
        env:
          APP: ${{ inputs.app }}
        run: task "$APP:docker:smoke" IMAGE="$APP:smoke"

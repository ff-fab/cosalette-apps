name: Documentation (per-app)
on:
  workflow_call:
    inputs:
      app:
        required: true
        type: string

env:
  # Image reference used by the devcontainer-run composite action
  DEVCONTAINER_IMAGE: ghcr.io/ff-fab/cosalette-apps-devcontainer

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build ${{ inputs.app }} docs inside devcontainer
        uses: ./.github/actions/devcontainer-run
        with:
          run-cmd: task ${{ inputs.app }}:docs:build
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload docs artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-${{ inputs.app }}
          path: apps/${{ inputs.app }}/site
          retention-days: 1

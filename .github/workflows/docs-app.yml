name: Documentation (per-app)
on:
  workflow_call:
    inputs:
      app:
        required: true
        type: string
    # Optional: passed only on main push or main workflow_dispatch events.
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false

env:
  # Image reference used by the devcontainer-run composite action
  DEVCONTAINER_IMAGE: ghcr.io/ff-fab/cosalette-apps-devcontainer

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build ${{ inputs.app }} docs inside devcontainer
        uses: ./.github/actions/devcontainer-run
        with:
          run-cmd: task ${{ inputs.app }}:docs:build
          token: ${{ secrets.GITHUB_TOKEN }}
          dockerhub-username: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && secrets.DOCKERHUB_USERNAME || '' }}
          dockerhub-token: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && secrets.DOCKERHUB_TOKEN || '' }}
      - name: Upload docs artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-${{ inputs.app }}
          path: apps/${{ inputs.app }}/site
          retention-days: 1

name: 'Run in DevContainer'
description: >
  Prepare runner caches, log in to GHCR, set up Buildx, and run a command
  inside the project devcontainer via devcontainers/ci.

# Security trust boundary:
#   This is a repository-local composite action. On pull_request events from
#   same-repo branches the GITHUB_TOKEN passed as 'token' has the permissions
#   granted by the calling job (typically contents: read, packages: read).
#   For fork pull_request events GitHub does not pass secrets, so the token
#   is read-only and no confidential data is at risk.
#   Long-term: consider pinning this action from a trusted external ref or
#   moving the GHCR login step into the calling workflow instead.

inputs:
  run-cmd:
    description: 'Command to execute inside the devcontainer'
    required: true
  token:
    description: 'GitHub token for GHCR login'
    required: true
  cargo-cache:
    description: >-
      Restore and save Cargo registry and target caches ('true' to enable).
      Enable only for jobs that compile Rust (maturin/cargo). Gated
      separately to prevent non-Rust jobs from winning the first-writer-wins
      save race and poisoning the key.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Prepare workspace cache directories
      shell: bash
      run: mkdir -p .cache/uv .cache/pre-commit .cache/cargo-home/registry .cache/cargo-home/git target

    # Bump the vN suffix to force-invalidate when cache format or path layout changes.
    - name: Restore uv cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .cache/uv
        key: ${{ runner.os }}-uv-v1-${{ hashFiles('uv.lock') }}
        restore-keys: |
          ${{ runner.os }}-uv-v1-

    - name: Save uv cache
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: always()
      with:
        path: .cache/uv
        key: ${{ runner.os }}-uv-v1-${{ hashFiles('uv.lock') }}

    - name: Restore pre-commit cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .cache/pre-commit
        key: ${{ runner.os }}-pre-commit-v1-${{ hashFiles('.pre-commit-config.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pre-commit-v1-

    - name: Save pre-commit cache
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: always()
      with:
        path: .cache/pre-commit
        key: ${{ runner.os }}-pre-commit-v1-${{ hashFiles('.pre-commit-config.yaml') }}

    - name: Restore cargo registry cache
      if: inputs.cargo-cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          .cache/cargo-home/registry
          .cache/cargo-home/git
        key: ${{ runner.os }}-cargo-home-v1-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-home-v1-

    - name: Restore cargo target cache
      if: inputs.cargo-cache == 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: target
        key: ${{ runner.os }}-cargo-target-v1-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-target-v1-

    - name: Log in to GHCR
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.token }}

    - name: Set up Docker Buildx
      # docker-container driver required for type=registry cache-from (mode=max format).
      # Without it, the docker driver falls back to inline-cache only, missing all
      # cached layers and triggering a full rebuild that pulls the base image from MCR.
      uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      with:
        driver: docker-container

    - name: Run command in devcontainer
      uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
      env:
        # Read by devcontainer.json's build.args via ${localEnv:...} — skips
        # installing Claude Code on a cache-miss rebuild since CI never
        # invokes `claude`. Local devcontainer builds default to installing it.
        INSTALL_CLAUDE_CODE: 'false'
      with:
        # Aligns with the buildcache manifest devcontainer-build.yml writes to
        # via cacheTo type=registry,...,mode=max — matching the write side's
        # tag here is what makes cache hits actually land instead of silently
        # falling back to a full image rebuild.
        cacheFrom: type=registry,ref=ghcr.io/ff-fab/cosalette-apps-devcontainer:buildcache
        push: never
        # devcontainers/ci only forwards env vars declared here (under `with:`)
        # into the containerized runCmd — a step-level `env:` (above) only
        # affects the Node process invoking this action, not the container.
        # Paths are the container-side mount point from devcontainer.json's
        # workspaceFolder, not the runner's ${{ github.workspace }}.
        env: |
          UV_CACHE_DIR=/workspaces/cosalette-apps/.cache/uv
          PRE_COMMIT_HOME=/workspaces/cosalette-apps/.cache/pre-commit
          CARGO_HOME=/workspaces/cosalette-apps/.cache/cargo-home
          CARGO_TARGET_DIR=/workspaces/cosalette-apps/target
        runCmd: ${{ inputs.run-cmd }}

    - name: Prune Rust incremental artifacts before cache save
      if: inputs.cargo-cache == 'true'
      shell: bash
      run: find target/debug/incremental -mindepth 1 -delete 2>/dev/null || true

    - name: Save cargo target cache
      if: inputs.cargo-cache == 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: target
        key: ${{ runner.os }}-cargo-target-v1-${{ hashFiles('**/Cargo.lock') }}
